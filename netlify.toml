[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The marketing site now lives at stellaruc.com (primary domain). The legacy hostname redirects
# there for pages, but /api/* is kept on the legacy host: the ElevenLabs intake tools and other
# machine callers post to it and do not follow redirects. Order matters: first match wins.
# CANARY (temporary)
[[redirects]]
  from = "https://deploy-preview-31--ai4-contact-center.netlify.app/api/*"
  to = "/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://deploy-preview-31--ai4-contact-center.netlify.app/*"
  to = "https://stellaruc.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://ai4contactcenter.aproposgroupllc.com/api/*"
  to = "/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://ai4contactcenter.aproposgroupllc.com/*"
  to = "https://stellaruc.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
